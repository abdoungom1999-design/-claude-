services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: spid
      POSTGRES_PASSWORD: spid
      POSTGRES_DB: spid
    ports:
      - '5432:5432'
    volumes:
      - spid_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - spid_redis_data:/data

volumes:
  spid_postgres_data:
  spid_redis_data:
