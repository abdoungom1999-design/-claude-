<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sprint — VTC moto-taxi et livraison de colis à Dakar.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sprint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sprint</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API, requise par google_maps_flutter sur le
    Web. Clé PLACEHOLDER ("A_REMPLACER") tant qu'aucune clé Google Cloud
    n'a été fournie — voir GOOGLE_MAPS_SETUP.md et
    lib/core/config/google_maps_config.dart (même valeur à garder en
    phase avec ce script). Inoffensif tant qu'aucun écran n'affiche
    encore de widget GoogleMap : ce script échoue silencieusement côté
    navigateur (bandeau "Pour un usage développeur uniquement" dans la
    console), sans impacter le reste de l'app.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=A_REMPLACER&libraries=places" async defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
