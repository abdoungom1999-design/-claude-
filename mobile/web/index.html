<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Même réglage que celui que Flutter applique lui-même au démarrage (il
       remplace cette balise) : nécessaire
       dès maintenant pour que l'écran de démarrage ait la bonne taille sur mobile. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sprint — VTC moto-taxi et livraison de colis à Dakar.">
  <meta name="theme-color" content="#0B0B0C">

  <!-- Installation sur l'écran d'accueil : plein écran (sans barre Safari),
       nom et icône Sprint. iOS n'utilise pas les icônes du manifeste :
       apple-touch-icon (180 x 180, opaque) est obligatoire. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sprint">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Écran de démarrage iPhone (fond Onyx + logo « S ») : iOS l'affiche à
       l'ouverture du site installé, avant tout code. Une image par taille
       d'écran (iOS ne prend que celle dont la taille correspond exactement) ;
       à défaut, écran blanc. Mise en cache à l'installation : pour la voir
       après une mise à jour, supprimer l'icône puis réinstaller le site. -->
  <link rel="apple-touch-startup-image" href="splash/ios-430x932@3x.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-393x852@3x.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-428x926@3x.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-390x844@3x.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-375x812@3x.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-414x896@3x.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-414x896@2x.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-414x736@3x.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-375x667@2x.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-320x568@2x.png"
        media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-402x874@3x.png"
        media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ios-440x956@3x.png"
        media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sprint</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Écran de démarrage Onyx : affiché tout de suite (CSS en ligne, aucun
       fichier à attendre), retiré quand Sprint a dessiné sa première image
       (voir le script plus bas). Même fond et même logo que l'écran de
       démarrage de l'app (lib/core/widgets/splash_sprint.dart). */
    html, body { margin: 0; height: 100%; background: #0B0B0C; }
    #demarrage {
      position: fixed; inset: 0; z-index: 20000;
      display: flex; align-items: center; justify-content: center;
      background: #0B0B0C;
      transition: opacity .4s ease;
    }
    #demarrage.parti { opacity: 0; pointer-events: none; }
    #demarrage svg { width: 96px; height: 96px; opacity: 0; animation: demarrage-apparition .6s ease .05s forwards; }
    @keyframes demarrage-apparition { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #demarrage svg { animation: none; opacity: 1; }
      #demarrage { transition: none; }
    }

    /* Aide à l'installation sur iPhone (voir le script plus bas). */
    #aide-installation {
      position: fixed; left: 12px; right: 12px; z-index: 10000;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: none; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 16px;
      background: #0E0E0E; color: #fff;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }
    #aide-installation img { width: 40px; height: 40px; border-radius: 9px; flex: none; }
    #aide-installation svg { vertical-align: -3px; }
    #aide-installation button {
      flex: none; border: 0; background: none; color: #fff;
      font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Écran de démarrage (voir le style plus haut). -->
  <div id="demarrage" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <path d="M69 27C66 10 30 10 30 32C30 52 70 47 70 68C70 90 34 90 30 74" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="74" r="6.4" fill="#FF6600"/>
    </svg>
  </div>
  <script>
    // Retire l'écran de démarrage une fois la première image de Sprint
    // dessinée, mais pas avant 0,7 s (le logo doit avoir le temps d'être vu
    // et le passage reste fluide), et au plus tard après 20 s (l'app n'a
    // alors pas pu démarrer : on ne cache pas la page indéfiniment).
    (function () {
      var debut = Date.now(), minimum = 700, retire = false;
      function retirer() {
        if (retire) return;
        retire = true;
        var ecran = document.getElementById('demarrage');
        if (!ecran) return;
        ecran.classList.add('parti');
        setTimeout(function () { if (ecran.parentNode) ecran.parentNode.removeChild(ecran); }, 500);
      }
      window.addEventListener('flutter-first-frame', function () {
        var reste = minimum - (Date.now() - debut);
        if (reste > 0) setTimeout(retirer, reste); else retirer();
      });
      setTimeout(retirer, 20000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Aide à l'installation, une seule fois, tant que Sprint n'est pas
       ouvert en app : iPhone/iPad (Apple ne permet pas l'installation d'un
       site en un clic : on explique le geste) et Android (lien vers l'APK,
       plus complet que le site : GPS écran verrouillé, alertes). -->
  <div id="aide-installation" role="dialog" aria-label="Installer Sprint">
    <img src="icons/apple-touch-icon.png" alt="">
    <div data-plateforme="ios">
      <strong>Installez Sprint sur votre iPhone</strong><br>
      Touchez
      <svg width="16" height="18" viewBox="0 0 16 18" aria-label="Partager">
        <path d="M8 1v11M4 5l4-4 4 4M3 8H1.5v9h13V8H13" fill="none" stroke="#FF6600" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <strong>Partager</strong>, puis <strong>« Sur l'écran d'accueil »</strong>.
    </div>
    <div data-plateforme="android">
      <strong>Sprint existe en application Android</strong><br>
      <a href="/android/" style="color:#FF6600;font-weight:700">Télécharger l'application</a>
    </div>
    <button type="button" aria-label="Fermer">×</button>
  </div>
  <script>
    (function () {
      var cle = 'sprint-aide-installation-fermee';
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/.test(navigator.userAgent);
      var installee = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var dejaFermee = false;
      try { dejaFermee = localStorage.getItem(cle) === '1'; } catch (e) {}
      if (!(ios || android) || installee || dejaFermee) return;
      var aide = document.getElementById('aide-installation');
      var autre = aide.querySelector('[data-plateforme="' + (ios ? 'android' : 'ios') + '"]');
      autre.parentNode.removeChild(autre);
      aide.querySelector('button').addEventListener('click', function () {
        aide.style.display = 'none';
        try { localStorage.setItem(cle, '1'); } catch (e) {}
      });
      // Après le chargement de l'app, pour ne pas masquer l'écran d'accueil.
      setTimeout(function () { aide.style.display = 'flex'; }, 4000);
    })();
  </script>
</body>
</html>
