name: spid
description: >
  Spid - plateforme VTC & livraison (moto-taxis et colis) pour Dakar.
  Application Flutter couvrant les interfaces Client, Conducteur et Admin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
