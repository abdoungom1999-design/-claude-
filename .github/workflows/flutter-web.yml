name: Build & déployer Sprint Web

# À chaque push : compile l'app Flutter (dossier mobile/) en site
# statique et en APK Android, teste le backend (Cloud Functions et règles
# Firestore sur émulateur), déploie le backend sur Firebase (fonctions
# puis règles), puis publie sur Firebase Hosting (https://sprint-vtc.web.app)
# l'app web à la racine et l'APK Android (/android/, /sprint.apk).
# L'ancienne adresse GitHub Pages redirige vers le nouveau site. Rien
# n'est déployé si un test échoue.
on:
  push:
    branches:
      - claude/spid-vtc-livraison-2scatm
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL du backend à utiliser (laisser vide pour la valeur par défaut)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Clé Google du fond de carte (Map Tiles API), restreinte au site :
      # visible dans le navigateur comme toute clé de carte web. Sans elle,
      # la carte reste sur OpenStreetMap.
      - name: Build web (release)
        env:
          GOOGLE_MAPS_WEB_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url }}" \
            --dart-define=GOOGLE_MAPS_WEB_KEY="$GOOGLE_MAPS_WEB_KEY"

      # Garde-fou : aucun secret dans le site compilé (le dépôt et les
      # journaux de la CI sont publics). Seules sont admises la clé web
      # Firebase (publique par conception) et la clé de carte restreinte
      # injectée ci-dessus ; toute autre clé est une fuite.
      - name: Sécurité · aucun secret dans le site compilé
        env:
          GOOGLE_MAPS_WEB_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: node securite/garde_fuites.mjs dossier build/web

      # Vérification réelle auprès de Google : la clé web, présentée comme
      # venant du site, ouvre une session de carte avec le style « Sprint
      # clair ». Non bloquant (avertissement dans le résumé du run).
      - name: Vérifier la carte Google du site (clé web + style)
        env:
          CLE: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: |
          if [ -z "$CLE" ]; then echo "::warning::Pas de clé GOOGLE_MAPS_WEB_KEY : carte OpenStreetMap."; exit 0; fi
          dart run tool/style_carte_json.dart "$RUNNER_TEMP/style.json" > /dev/null
          bash tool/verifier_session_carte.sh "Carte du site" "$RUNNER_TEMP/style.json" \
            "Referer: https://sprint-vtc.web.app/"

      # Site publié sur Firebase Hosting (job hebergement).
      - uses: actions/upload-artifact@v4
        with:
          name: site-web
          path: mobile/build/web
          retention-days: 3

      # GitHub Pages ne sert plus que la redirection vers le nouveau site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/hebergement/redirection

  # Tests du backend : moteur de prix, paiement et création des courses
  # (Cloud Functions, dont émulateur Firestore) et règles de sécurité
  # Firestore.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # Historique complet : le garde-fou analyse les lignes ajoutées par le push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/functions/package-lock.json
            mobile/firestore_rules_test/package-lock.json

      # L'émulateur Firestore est une application Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --prefix functions

      - run: npm ci --prefix firestore_rules_test

      # Contrôles de sécurité (voir mobile/securite/LISEZMOI.md). Ils
      # bloquent le déploiement : secrets dans le dépôt, dépendances
      # vulnérables. Exceptions motivées et datées : securite/exceptions.json.
      - name: Sécurité · les contrôles eux-mêmes (tests)
        run: node --test securite/test/*.test.mjs

      - name: Sécurité · aucun secret dans les fichiers du dépôt
        run: node securite/garde_fuites.mjs fichiers

      - name: Sécurité · aucun secret dans les lignes ajoutées par ce push
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
        run: node securite/garde_fuites.mjs diff "$AVANT" "$APRES"

      - name: Sécurité · vulnérabilités connues des Cloud Functions (production)
        run: node securite/audit_npm.mjs functions --prod --seuil high

      # Outils de test seulement (jamais déployés) : on ne bloque que le critique.
      - name: Sécurité · vulnérabilités connues des outils de test
        run: node securite/audit_npm.mjs firestore_rules_test --seuil critical

      - name: Sécurité · avis de sécurité des paquets Dart (pubspec.lock)
        run: node securite/avis_dart.mjs pubspec.lock

      - name: Cloud Functions (moteur de prix, validation, signatures)
        run: npm test --prefix functions

      - name: Cloud Functions (paiement et création des courses, émulateur)
        run: npm run test:emulateur --prefix functions

      - name: Règles Firestore (émulateur)
        run: npm test --prefix firestore_rules_test

  # Déploiement Firebase : Cloud Functions d'abord, puis règles Firestore
  # (qui interdisent la création directe des courses et les annulations
  # sans remboursement). Nécessite le
  # secret FIREBASE_SERVICE_ACCOUNT (voir mobile/FIREBASE_SETUP.md,
  # étape 7) ; sans lui, l'étape est sautée avec un avertissement.
  firebase:
    needs: [build, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        id: secret
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase non déployé::Secret FIREBASE_SERVICE_ACCOUNT absent : Cloud Functions et règles Firestore NON déployées (voir mobile/FIREBASE_SETUP.md, étape 7)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/functions/package-lock.json

      - if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.secret.outputs.present == 'true'
        run: npm ci --prefix functions

      # La surveillance des paiements (toutes les 5 minutes) est une tâche
      # Cloud Scheduler : sans le rôle "Administrateur Cloud Scheduler",
      # son déploiement échouerait au milieu des autres. On vérifie donc
      # AVANT de toucher à quoi que ce soit : l'app en ligne reste intacte.
      - name: Vérifier les droits du compte de déploiement
        if: steps.secret.outputs.present == 'true'
        run: |
          jeton=$(gcloud auth print-access-token)
          reponse=$(curl -s -X POST \
            "https://cloudresourcemanager.googleapis.com/v1/projects/sprint-vtc:testIamPermissions" \
            -H "Authorization: Bearer $jeton" -H 'Content-Type: application/json' \
            -d '{"permissions":["cloudscheduler.jobs.create","cloudscheduler.jobs.update"]}')
          echo "$reponse"
          if echo "$reponse" | grep -q '"error"'; then
            echo "::error title=Vérification impossible::Google a refusé la vérification des droits (réponse ci-dessus). Rien n'a été déployé."
            exit 1
          fi
          if ! echo "$reponse" | grep -q '"cloudscheduler.jobs.create"'; then
            echo "::error title=Rôle manquant::Le compte github-deploy n'a pas le rôle « Administrateur Cloud Scheduler » (surveillance des paiements). Ajoutez-le dans Google Cloud > IAM (voir mobile/FIREBASE_SETUP.md, étape 7), puis relancez ce job. Rien n'a été déployé."
            exit 1
          fi

      # --force : accepte sans question la politique de nettoyage des
      # images de build (Artifact Registry) et supprime les fonctions
      # retirées du code (ex. l'ancienne "creerCourse").
      - name: Déployer les Cloud Functions
        if: steps.secret.outputs.present == 'true'
        run: npx --yes firebase-tools@15 deploy --only functions --project sprint-vtc --non-interactive --force

      # Les fonctions sont appelées depuis le navigateur (et, pour le
      # webhook et la page de paiement simulée, par l'opérateur et le
      # client) : l'accès réseau doit être public (Cloud Run "allUsers").
      # La sécurité est dans chaque fonction : Firebase Auth pour les
      # fonctions de l'app, signature pour le webhook. Réappliqué à chaque
      # déploiement, car une création interrompue peut l'avoir omis. La
      # surveillance (surveillercommandes) reste privée.
      - name: Autoriser l'appel des fonctions depuis l'app
        if: steps.secret.outputs.present == 'true'
        run: |
          for service in estimerprix creerpaiement annulercourse webhookpaiement pagepaiementsimule \
                         rechercheradresses coordonneesadresse remboursercourseadmin sanctionnercompte \
                         chauffeursproches notifiermessage notifieracceptation \
                         creerrecharge ajusterportefeuille migrerdocumentskyc \
                         connexiontelephone synchroniserannuaire; do
            gcloud run services add-iam-policy-binding "$service" \
              --project=sprint-vtc --region=europe-west1 \
              --member=allUsers --role=roles/run.invoker --quiet > /dev/null
            echo "Accès public : $service"
          done

      # Vérification réelle : sans connexion, chaque fonction de l'app doit
      # répondre elle-même "UNAUTHENTICATED" (et non être bloquée par
      # Google) ; le webhook doit refuser un appel non signé (401) et la
      # page de paiement un lien invalide (400).
      - name: Vérifier que les fonctions répondent
        if: steps.secret.outputs.present == 'true'
        run: |
          base=https://europe-west1-sprint-vtc.cloudfunctions.net
          for fonction in estimerPrix creerPaiement annulerCourse rechercherAdresses coordonneesAdresse \
                          rembourserCourseAdmin sanctionnerCompte chauffeursProches \
                          notifierMessage notifierAcceptation creerRecharge ajusterPortefeuille \
                          migrerDocumentsKyc synchroniserAnnuaire; do
            reponse=$(curl -s -X POST "$base/$fonction" -H 'Content-Type: application/json' -d '{"data":{}}')
            echo "$fonction : $reponse"
            echo "$reponse" | grep -q UNAUTHENTICATED || { echo "::error::$fonction ne répond pas correctement"; exit 1; }
          done
          # Connexion par téléphone : appelable sans être connecté (c'est son
          # rôle) ; une demande vide doit être refusée par la fonction elle-même.
          reponse=$(curl -s -X POST "$base/connexionTelephone" -H 'Content-Type: application/json' -d '{"data":{}}')
          echo "connexionTelephone : $reponse"
          echo "$reponse" | grep -q INVALID_ARGUMENT || { echo "::error::connexionTelephone ne répond pas correctement"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/webhookPaiement" \
            -H 'Content-Type: application/json' -d '{"data":{}}')
          echo "webhookPaiement sans signature : HTTP $code"
          [ "$code" = 401 ] || { echo "::error::webhookPaiement devrait refuser un appel non signé (401)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/pagePaiementSimule?session=invalide")
          echo "pagePaiementSimule lien invalide : HTTP $code"
          [ "$code" = 400 ] || { echo "::error::pagePaiementSimule ne répond pas correctement"; exit 1; }

      # Notifications push : l'API Firebase Cloud Messaging doit être
      # active et joignable. Contrôle réel (envoi "à blanc" vers un jeton
      # volontairement invalide, rien n'est délivré) : 400 = l'API répond
      # et le compte est autorisé ; 403 = API désactivée ou droit manquant.
      # Simple avertissement : le compte de déploiement n'est pas celui qui
      # envoie les notifications (compte des fonctions), donc un 403 ici
      # est à vérifier sans forcément bloquer.
      - name: Vérifier l'API des notifications push (FCM)
        if: steps.secret.outputs.present == 'true'
        run: |
          jeton=$(gcloud auth print-access-token)
          code=$(curl -s -o fcm.json -w '%{http_code}' -X POST \
            "https://fcm.googleapis.com/v1/projects/sprint-vtc/messages:send" \
            -H "Authorization: Bearer $jeton" -H 'Content-Type: application/json' \
            -d '{"validate_only":true,"message":{"token":"jeton-de-verification-invalide","notification":{"title":"t","body":"b"}}}')
          echo "FCM (envoi à blanc) : HTTP $code"
          grep -o '"status": *"[A-Z_]*"' fcm.json || true
          if [ "$code" = 400 ] || [ "$code" = 404 ]; then
            echo "API FCM active et joignable."
          else
            echo "::warning title=Notifications push::L'API Firebase Cloud Messaging a répondu HTTP $code (voir le journal). Si les notifications n'arrivent pas : activer « Firebase Cloud Messaging API » dans Google Cloud > API et services, et vérifier le rôle du compte des fonctions."
          fi

      - name: Publier les règles Firestore
        if: steps.secret.outputs.present == 'true'
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project sprint-vtc --non-interactive

      # Documents KYC des chauffeurs : règles Firebase Storage, publiées
      # seulement si Storage est activé sur le projet (Console > Build >
      # Storage > Commencer, voir FIREBASE_SETUP.md étape 5). Sans bucket
      # (HTTP 404), simple avertissement : l'app garde son repli Base64.
      # Jamais bloquant : le site et l'APK doivent partir dans tous les cas.
      - name: Règles Firebase Storage (documents KYC)
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://firebasestorage.googleapis.com/v0/b/sprint-vtc.firebasestorage.app/o?maxResults=1")
          echo "Bucket Storage sprint-vtc.firebasestorage.app : HTTP $code"
          if [ "$code" = 404 ]; then
            echo "::warning title=Firebase Storage::Storage n'est pas activé sur le projet (bucket introuvable). Les pièces KYC des chauffeurs restent stockées en Base64 dans Firestore. À faire : Console Firebase > Build > Storage > Commencer (voir mobile/FIREBASE_SETUP.md, étape 5). Règles Storage non publiées."
          else
            npx --yes firebase-tools@15 deploy --only storage --project sprint-vtc --non-interactive
          fi

  # Ancienne adresse (GitHub Pages) : page de redirection vers
  # https://sprint-vtc.web.app, publiée une fois le nouveau site en ligne.
  deploy:
    needs: [hebergement]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # APK Android de test, pour les chauffeurs, publié par le job
  # hebergement, toujours au même lien (à partager sur WhatsApp) :
  #   https://sprint-vtc.web.app/sprint.apk   (page : https://sprint-vtc.web.app/android/)
  # Compilé après le déploiement du backend : l'APK parle aux mêmes Cloud
  # Functions que le site. Rien à configurer à la main :
  # - l'app Android est enregistrée dans Firebase si besoin (API
  #   Firebase Management, compte github-deploy) ;
  # - la clé de signature est créée une seule fois et gardée dans Secret
  #   Manager (ANDROID_SIGNATURE) : chaque APK s'installe par-dessus le
  #   précédent. Elle n'apparaît jamais dans le dépôt ni dans les journaux.
  android:
    needs: [firebase]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        id: secret
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK non compilé::Secret FIREBASE_SERVICE_ACCOUNT absent (voir mobile/FIREBASE_SETUP.md, étape 7)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: App Android dans Firebase
        id: firebase_android
        if: steps.secret.outputs.present == 'true'
        run: |
          jeton=$(gcloud auth print-access-token)
          api=https://firebase.googleapis.com/v1beta1/projects/sprint-vtc/androidApps
          appeler() {
            reponse=$(curl -s -w '\n%{http_code}' "$@" -H "Authorization: Bearer $jeton")
            code=${reponse##*$'\n'}
            corps=${reponse%$'\n'*}
            if [ "${code:0:1}" != 2 ]; then
              echo "$corps"
              echo "::error title=Firebase::Appel à l'API Firebase refusé (HTTP $code)."
              exit 1
            fi
          }
          appeler "$api"
          app_id=$(echo "$corps" | jq -r '[.apps[]? | select(.packageName == "sn.groupesantine.sprint")][0].appId // empty')
          if [ -z "$app_id" ]; then
            echo "Première compilation : enregistrement de l'app Android dans Firebase."
            appeler -X POST "$api" -H 'Content-Type: application/json' \
              -d '{"packageName":"sn.groupesantine.sprint","displayName":"Sprint Android"}'
            operation=$(echo "$corps" | jq -r '.name')
            for essai in $(seq 1 30); do
              appeler "https://firebase.googleapis.com/v1beta1/$operation"
              if [ "$(echo "$corps" | jq -r '.done // false')" = true ]; then
                app_id=$(echo "$corps" | jq -r '.response.appId // empty')
                break
              fi
              sleep 2
            done
          fi
          if [ -z "$app_id" ]; then
            echo "::error title=Firebase::Impossible d'obtenir l'identifiant de l'app Android."
            exit 1
          fi
          echo "App Android Firebase : $app_id"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Clé de signature (Secret Manager)
        if: steps.secret.outputs.present == 'true'
        run: |
          signature="$RUNNER_TEMP/signature.txt"
          if ! gcloud secrets describe ANDROID_SIGNATURE --project=sprint-vtc > /dev/null 2>&1; then
            echo "Première compilation : création de la clé de signature Sprint."
            mdp=$(openssl rand -hex 24)
            echo "::add-mask::$mdp"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nouvelle.jks" -storetype PKCS12 -alias sprint \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$mdp" -keypass "$mdp" \
              -dname "CN=Sprint, O=Groupe Santine, L=Dakar, C=SN" > /dev/null 2>&1
            { echo "$mdp"; base64 -w0 "$RUNNER_TEMP/nouvelle.jks"; echo; } > "$signature"
            gcloud secrets create ANDROID_SIGNATURE --project=sprint-vtc \
              --replication-policy=automatic --data-file="$signature"
            rm -f "$signature" "$RUNNER_TEMP/nouvelle.jks"
          fi
          gcloud secrets versions access latest --secret=ANDROID_SIGNATURE --project=sprint-vtc > "$signature"
          mdp=$(head -n 1 "$signature")
          echo "::add-mask::$mdp"
          sed -n 2p "$signature" | base64 -d > "$RUNNER_TEMP/sprint.jks"
          rm -f "$signature"
          echo "SPRINT_KEYSTORE_PATH=$RUNNER_TEMP/sprint.jks" >> "$GITHUB_ENV"
          echo "SPRINT_KEYSTORE_PASSWORD=$mdp" >> "$GITHUB_ENV"
          # Empreinte (publique) : sert à vérifier l'APK plus bas.
          keytool -list -v -keystore "$RUNNER_TEMP/sprint.jks" -storepass "$mdp" -alias sprint \
            | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/empreinte.txt"
          echo "Empreinte SHA-256 de la clé Sprint : $(cat "$RUNNER_TEMP/empreinte.txt")"

      - if: steps.secret.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: steps.secret.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - if: steps.secret.outputs.present == 'true'
        run: flutter pub get

      # Téléphones ARM uniquement (tous les smartphones) : APK plus léger
      # à envoyer sur WhatsApp. Numéro de version = numéro du run.
      # Clé Google du fond de carte pour l'APK (Map Tiles API), restreinte
      # à l'app Android (package + SHA-1 du certificat Sprint). Sans elle,
      # la carte de l'APK reste sur OpenStreetMap.
      - name: Compiler l'APK
        if: steps.secret.outputs.present == 'true'
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_KEY" ]; then
            echo "::warning::Pas de clé GOOGLE_MAPS_ANDROID_KEY : carte OpenStreetMap dans l'APK."
          fi
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ steps.firebase_android.outputs.app_id }} \
            --dart-define=GOOGLE_MAPS_ANDROID_KEY="$GOOGLE_MAPS_ANDROID_KEY"

      # L'APK doit être signé avec la clé Sprint (et non une clé de debug),
      # sinon les mises à jour ne s'installeraient pas.
      - name: Vérifier la signature de l'APK
        if: steps.secret.outputs.present == 'true'
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          attendu=$(cat "$RUNNER_TEMP/empreinte.txt")
          echo "apksigner : $apksigner"
          echo "Empreinte attendue (clé Sprint) : $attendu"
          if [ -z "$apksigner" ] || [ ${#attendu} -ne 64 ]; then
            echo "::error::Vérification impossible (apksigner ou empreinte introuvable)"
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certificats.txt" 2>&1; then
            cat "$RUNNER_TEMP/certificats.txt"
            echo "::error::apksigner refuse l'APK"
            exit 1
          fi
          cat "$RUNNER_TEMP/certificats.txt"
          if ! tr -d ':' < "$RUNNER_TEMP/certificats.txt" | grep -qi "$attendu"; then
            echo "::error::APK non signé avec la clé Sprint"
            exit 1
          fi
          echo "Signature Sprint vérifiée."
          # L'app présente cette empreinte SHA-1 à Google (clé de carte
          # restreinte à Android) : elle doit être celle du certificat.
          sha1=$(grep -o "'X-Android-Cert': '[0-9A-F]*'" lib/core/maps/fond_carte.dart | grep -o '[0-9A-F]\{40\}')
          if ! tr -d ':' < "$RUNNER_TEMP/certificats.txt" | grep -i 'SHA-1 digest' | grep -qi "$sha1"; then
            echo "::error::L'empreinte SHA-1 de fond_carte.dart ($sha1) n'est pas celle du certificat de l'APK"
            exit 1
          fi
          echo "Empreinte SHA-1 présentée à Google : conforme."
          ls -lh "$apk"

      # Aucun secret dans l'APK. Non bloquant tant que ce contrôle n'a pas
      # tourné sur un vrai APK de la CI (à rendre bloquant ensuite).
      - name: Sécurité · aucun secret dans l'APK
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: node securite/garde_fuites.mjs apk build/app/outputs/flutter-apk/app-release.apk

      # Vérification réelle auprès de Google : la clé Android, présentée
      # avec l'identité de l'APK, ouvre une session de carte avec le style
      # « Sprint clair ». Non bloquant (avertissement dans le résumé).
      - name: Vérifier la carte Google de l'APK (clé Android + style)
        if: steps.secret.outputs.present == 'true'
        env:
          CLE: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$CLE" ]; then echo "::warning::Pas de clé GOOGLE_MAPS_ANDROID_KEY."; exit 0; fi
          sha1=$(grep -o "'X-Android-Cert': '[0-9A-F]*'" lib/core/maps/fond_carte.dart | grep -o '[0-9A-F]\{40\}')
          dart run tool/style_carte_json.dart "$RUNNER_TEMP/style.json" > /dev/null
          bash tool/verifier_session_carte.sh "Carte de l'APK" "$RUNNER_TEMP/style.json" \
            "X-Android-Package: sn.groupesantine.sprint" "X-Android-Cert: $sha1"

      # APK et page de téléchargement (version, taille, date inscrites),
      # remis au job hebergement qui publie tout le site d'un coup.
      - name: Préparer l'APK et sa page
        if: steps.secret.outputs.present == 'true'
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}') (${{ github.run_number }})"
          taille="$(stat -c %s "$apk" | awk '{printf "%.0f Mo", $1 / 1048576}')"
          jour=$(TZ=Africa/Dakar date '+%d/%m/%Y')
          mkdir -p "$RUNNER_TEMP/livraison"
          cp "$apk" "$RUNNER_TEMP/livraison/sprint.apk"
          sed -e "s|__VERSION__|$version|g" -e "s|__TAILLE__|$taille|g" -e "s|__DATE__|$jour|g" \
            hebergement/android/index.html > "$RUNNER_TEMP/livraison/android.html"
          echo "$version" > "$RUNNER_TEMP/livraison/version.txt"
          rm -f "$RUNNER_TEMP/sprint.jks"
          echo "APK $version, $taille"

      - if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/livraison
          retention-days: 3

  # Site Firebase Hosting (https://sprint-vtc.web.app), publié en un seul
  # déploiement : Firebase Hosting remplace tout le site à chaque fois.
  #   /             app web Sprint (PWA)
  #   /android/     page de téléchargement de l'APK
  #   /sprint.apk   APK Android
  # Si l'APK n'a pas pu être compilé, le site est quand même publié avec
  # l'APK déjà en ligne (repris tel quel), pour ne jamais le supprimer.
  hebergement:
    needs: [build, firebase, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.firebase.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        id: secret
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Site non publié::Secret FIREBASE_SERVICE_ACCOUNT absent (voir mobile/FIREBASE_SETUP.md, étape 7)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.secret.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-web
          path: mobile/build/web

      - if: steps.secret.outputs.present == 'true' && needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/livraison

      # Site Firebase Hosting du projet (créé au premier passage s'il
      # n'existe pas encore).
      - name: Site Firebase Hosting
        id: hosting
        if: steps.secret.outputs.present == 'true'
        run: |
          gcloud services enable firebasehosting.googleapis.com --project=sprint-vtc
          jeton=$(gcloud auth print-access-token)
          api=https://firebasehosting.googleapis.com/v1beta1/projects/sprint-vtc/sites
          appeler() {
            reponse=$(curl -s -w '\n%{http_code}' "$@" -H "Authorization: Bearer $jeton")
            code=${reponse##*$'\n'}
            corps=${reponse%$'\n'*}
            if [ "${code:0:1}" != 2 ]; then
              echo "$corps"
              echo "::error title=Firebase Hosting::Appel refusé (HTTP $code)."
              exit 1
            fi
          }
          appeler "$api"
          adresse=$(echo "$corps" | jq -r '[.sites[]? | select(.type == "DEFAULT_SITE")][0].defaultUrl // empty')
          if [ -z "$adresse" ]; then
            echo "Premier passage : création du site Firebase Hosting."
            appeler -X POST "$api?siteId=sprint-vtc" -H 'Content-Type: application/json' -d '{}'
            adresse=$(echo "$corps" | jq -r '.defaultUrl // empty')
          fi
          [ -n "$adresse" ] || { echo "::error::Adresse du site Firebase Hosting introuvable"; exit 1; }
          echo "Site : $adresse"
          echo "adresse=$adresse" >> "$GITHUB_OUTPUT"

      # APK absent (compilation en échec) : on reprend celui en ligne.
      - name: Reprendre l'APK en ligne
        if: steps.secret.outputs.present == 'true' && needs.android.result != 'success'
        run: |
          adresse="${{ steps.hosting.outputs.adresse }}"
          echo "::warning title=APK non recompilé::Le site est publié avec l'APK déjà en ligne."
          mkdir -p "$RUNNER_TEMP/livraison"
          curl -sfL "$adresse/sprint.apk" -o "$RUNNER_TEMP/livraison/sprint.apk"
          curl -sfL "$adresse/android/" -o "$RUNNER_TEMP/livraison/android.html"
          grep -o 'Version [^·<]*' "$RUNNER_TEMP/livraison/android.html" | head -n 1 | sed 's/^Version //; s/ *$//' \
            > "$RUNNER_TEMP/livraison/version.txt"

      # Publication, puis contrôle réel sur le site public : app à la
      # racine, page Android à jour, APK identique octet pour octet.
      - name: Publier le site sur Firebase Hosting
        if: steps.secret.outputs.present == 'true'
        run: |
          adresse="${{ steps.hosting.outputs.adresse }}"
          livraison="$RUNNER_TEMP/livraison"
          version=$(cat "$livraison/version.txt")
          hebergement/assembler.sh build/web "$livraison/sprint.apk" "$livraison/android.html"
          npx --yes firebase-tools@15 deploy --only hosting --project sprint-vtc --non-interactive \
            --message "Site ${GITHUB_SHA::7}, APK $version"
          attendu=$(sha256sum "$livraison/sprint.apk" | cut -d ' ' -f 1)
          for essai in 1 2 3 4 5 6; do
            curl -sfL "$adresse/sprint.apk" -o "$RUNNER_TEMP/telecharge.apk" || true
            recu=$(sha256sum "$RUNNER_TEMP/telecharge.apk" 2> /dev/null | cut -d ' ' -f 1)
            [ "$recu" = "$attendu" ] && break
            sleep 10
          done
          [ "$recu" = "$attendu" ] || { echo "::error::Le lien public ne sert pas l'APK attendu"; exit 1; }
          curl -sI "$adresse/sprint.apk" | grep -iE '^(HTTP|content-type|content-disposition)'
          curl -s "$adresse/android/" | grep -qF "Version $version" \
            || { echo "::error::La page /android/ n'affiche pas la version $version"; exit 1; }
          curl -s "$adresse/" | grep -q 'flutter_bootstrap.js' \
            || { echo "::error::L'app web n'est pas servie à la racine"; exit 1; }
          curl -s "$adresse/main.dart.js" -o /dev/null -w '%{http_code}' | grep -q 200 \
            || { echo "::error::main.dart.js introuvable"; exit 1; }
          # Notifications push du site : le service worker doit être servi
          # à la racine, en JavaScript (et non remplacé par la page
          # d'accueil, que le site renvoie pour toute adresse inconnue).
          curl -s "$adresse/firebase-messaging-sw.js" -o "$RUNNER_TEMP/sw.js" -w 'firebase-messaging-sw.js : HTTP %{http_code}, %{content_type}\n'
          grep -q 'firebase.messaging()' "$RUNNER_TEMP/sw.js" \
            || { echo "::error::Le service worker des notifications n'est pas servi à la racine du site"; exit 1; }
          curl -sI "$adresse/firebase-messaging-sw.js" | grep -qi '^content-type:.*javascript' \
            || { echo "::error::Le service worker des notifications n'est pas servi en JavaScript"; exit 1; }
          # En-têtes de sécurité (firebase.json) réellement servis par le
          # site public : avertissement s'il en manque (ils peuvent mettre
          # quelques secondes à se propager).
          for essai in 1 2 3 4; do
            entetes=$(curl -sI "$adresse/" | tr -d '\r')
            manquants=""
            for attendu in 'x-content-type-options: nosniff' 'x-frame-options: DENY' \
                           'referrer-policy: strict-origin-when-cross-origin' \
                           "content-security-policy: frame-ancestors 'none'" 'permissions-policy:'; do
              echo "$entetes" | grep -qiF "$attendu" || manquants="$manquants | $attendu"
            done
            [ -z "$manquants" ] && break
            sleep 10
          done
          if [ -n "$manquants" ]; then
            echo "::warning title=En-têtes de sécurité::Absents du site en ligne :$manquants"
          else
            echo "En-têtes de sécurité : présents sur $adresse/."
          fi
          echo "::notice title=Site publié::App : $adresse/ — APK $version : $adresse/sprint.apk (page : $adresse/android/)"
