name: Build & déployer Sprint Web

# À chaque push : compile l'app Flutter (dossier mobile/) en site
# statique, teste le backend (Cloud Functions et règles Firestore sur
# émulateur), déploie le backend sur Firebase (fonctions puis règles),
# puis publie l'app sur GitHub Pages. Rien n'est déployé si un test
# échoue.
on:
  push:
    branches:
      - claude/spid-vtc-livraison-2scatm
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL du backend à utiliser (laisser vide pour la valeur par défaut)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Clé Google du fond de carte (Map Tiles API), restreinte au site :
      # visible dans le navigateur comme toute clé de carte web. Sans elle,
      # la carte reste sur OpenStreetMap.
      - name: Build web (release)
        env:
          GOOGLE_MAPS_WEB_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url }}" \
            --dart-define=GOOGLE_MAPS_WEB_KEY="$GOOGLE_MAPS_WEB_KEY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  # Tests du backend : moteur de prix, paiement et création des courses
  # (Cloud Functions, dont émulateur Firestore) et règles de sécurité
  # Firestore.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/functions/package-lock.json
            mobile/firestore_rules_test/package-lock.json

      # L'émulateur Firestore est une application Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --prefix functions

      - run: npm ci --prefix firestore_rules_test

      - name: Cloud Functions (moteur de prix, validation, signatures)
        run: npm test --prefix functions

      - name: Cloud Functions (paiement et création des courses, émulateur)
        run: npm run test:emulateur --prefix functions

      - name: Règles Firestore (émulateur)
        run: npm test --prefix firestore_rules_test

  # Déploiement Firebase : Cloud Functions d'abord, puis règles Firestore
  # (qui interdisent la création directe des courses et les annulations
  # sans remboursement). Nécessite le
  # secret FIREBASE_SERVICE_ACCOUNT (voir mobile/FIREBASE_SETUP.md,
  # étape 7) ; sans lui, l'étape est sautée avec un avertissement.
  firebase:
    needs: [build, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        id: secret
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase non déployé::Secret FIREBASE_SERVICE_ACCOUNT absent : Cloud Functions et règles Firestore NON déployées (voir mobile/FIREBASE_SETUP.md, étape 7)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/functions/package-lock.json

      - if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.secret.outputs.present == 'true'
        run: npm ci --prefix functions

      # La surveillance des paiements (toutes les 5 minutes) est une tâche
      # Cloud Scheduler : sans le rôle "Administrateur Cloud Scheduler",
      # son déploiement échouerait au milieu des autres. On vérifie donc
      # AVANT de toucher à quoi que ce soit : l'app en ligne reste intacte.
      - name: Vérifier les droits du compte de déploiement
        if: steps.secret.outputs.present == 'true'
        run: |
          jeton=$(gcloud auth print-access-token)
          reponse=$(curl -s -X POST \
            "https://cloudresourcemanager.googleapis.com/v1/projects/sprint-vtc:testIamPermissions" \
            -H "Authorization: Bearer $jeton" -H 'Content-Type: application/json' \
            -d '{"permissions":["cloudscheduler.jobs.create","cloudscheduler.jobs.update"]}')
          echo "$reponse"
          if echo "$reponse" | grep -q '"error"'; then
            echo "::error title=Vérification impossible::Google a refusé la vérification des droits (réponse ci-dessus). Rien n'a été déployé."
            exit 1
          fi
          if ! echo "$reponse" | grep -q '"cloudscheduler.jobs.create"'; then
            echo "::error title=Rôle manquant::Le compte github-deploy n'a pas le rôle « Administrateur Cloud Scheduler » (surveillance des paiements). Ajoutez-le dans Google Cloud > IAM (voir mobile/FIREBASE_SETUP.md, étape 7), puis relancez ce job. Rien n'a été déployé."
            exit 1
          fi

      # --force : accepte sans question la politique de nettoyage des
      # images de build (Artifact Registry) et supprime les fonctions
      # retirées du code (ex. l'ancienne "creerCourse").
      - name: Déployer les Cloud Functions
        if: steps.secret.outputs.present == 'true'
        run: npx --yes firebase-tools@15 deploy --only functions --project sprint-vtc --non-interactive --force

      # Les fonctions sont appelées depuis le navigateur (et, pour le
      # webhook et la page de paiement simulée, par l'opérateur et le
      # client) : l'accès réseau doit être public (Cloud Run "allUsers").
      # La sécurité est dans chaque fonction : Firebase Auth pour les
      # fonctions de l'app, signature pour le webhook. Réappliqué à chaque
      # déploiement, car une création interrompue peut l'avoir omis. La
      # surveillance (surveillercommandes) reste privée.
      - name: Autoriser l'appel des fonctions depuis l'app
        if: steps.secret.outputs.present == 'true'
        run: |
          for service in estimerprix creerpaiement annulercourse webhookpaiement pagepaiementsimule \
                         rechercheradresses coordonneesadresse; do
            gcloud run services add-iam-policy-binding "$service" \
              --project=sprint-vtc --region=europe-west1 \
              --member=allUsers --role=roles/run.invoker --quiet > /dev/null
            echo "Accès public : $service"
          done

      # Vérification réelle : sans connexion, chaque fonction de l'app doit
      # répondre elle-même "UNAUTHENTICATED" (et non être bloquée par
      # Google) ; le webhook doit refuser un appel non signé (401) et la
      # page de paiement un lien invalide (400).
      - name: Vérifier que les fonctions répondent
        if: steps.secret.outputs.present == 'true'
        run: |
          base=https://europe-west1-sprint-vtc.cloudfunctions.net
          for fonction in estimerPrix creerPaiement annulerCourse rechercherAdresses coordonneesAdresse; do
            reponse=$(curl -s -X POST "$base/$fonction" -H 'Content-Type: application/json' -d '{"data":{}}')
            echo "$fonction : $reponse"
            echo "$reponse" | grep -q UNAUTHENTICATED || { echo "::error::$fonction ne répond pas correctement"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/webhookPaiement" \
            -H 'Content-Type: application/json' -d '{"data":{}}')
          echo "webhookPaiement sans signature : HTTP $code"
          [ "$code" = 401 ] || { echo "::error::webhookPaiement devrait refuser un appel non signé (401)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/pagePaiementSimule?session=invalide")
          echo "pagePaiementSimule lien invalide : HTTP $code"
          [ "$code" = 400 ] || { echo "::error::pagePaiementSimule ne répond pas correctement"; exit 1; }

      - name: Publier les règles Firestore
        if: steps.secret.outputs.present == 'true'
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project sprint-vtc --non-interactive

  deploy:
    needs: [build, firebase]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
