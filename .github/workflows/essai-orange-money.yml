name: Essai Orange Money

# Lancé à la main seulement (onglet Actions > Essai Orange Money > Run
# workflow), dans l'environnement d'Orange choisi au lancement :
# - bac_a_sable : api.sandbox.orange-sonatel.com, données de TEST ;
# - production : api.orange-sonatel.com, identifiants de PRODUCTION. L'essai
#   n'y paie RIEN : les demandes de paiement qu'il crée ne sont payées par
#   personne et expirent seules ; aucun argent ne bouge.
# Rien n'est publié : l'app et le serveur en ligne ne changent pas.
#
# 1. Tests automatiques du serveur, dont le paiement Orange Money avec un faux
#    Orange, unitaires et sur l'émulateur Firestore.
# 2. Identifiants de l'environnement lus dans Secret Manager, créés par le
#    client (bac à sable : ORANGE_MONEY_SANDBOX_CLIENT_ID et
#    ORANGE_MONEY_SANDBOX_CLIENT_SECRET ; production : ORANGE_MONEY_CLIENT_ID
#    et ORANGE_MONEY_CLIENT_SECRET) : présents et bien collés (ni vides, ni
#    espace, ni retour à la ligne, ni caractère invisible). Code marchand,
#    commun aux deux : celui saisi au lancement, sinon celui de Secret Manager
#    (ORANGE_MONEY_CODE_MARCHAND) s'il y est.
# 3. Facultatif (case « preparer_notifications ») : création dans Secret
#    Manager du code marchand et de la clé des notifications de
#    l'environnement s'ils manquent (jamais remplacés en silence), puis
#    enregistrement chez Orange (dans cet environnement) de l'adresse des
#    notifications de Sprint (fonction webhookOrangeMoney). Le serveur publié
#    ne s'en sert qu'une fois Orange Money ouvert dans cet environnement (go
#    du client).
# 4. Appels RÉELS à Orange : jeton d'accès, demande de paiement par QR code
#    (100 FCFA, jamais payée), adresses de notification enregistrées ; bac à
#    sable seulement : numéros de test, clé publique, pages des liens.
# 5. Parcours complet de Sprint contre le VRAI Orange, sur l'émulateur
#    Firestore (aucune donnée de production) : course et recharge payées par
#    Orange Money (demandes jamais payées), lien de paiement, recherche,
#    surveillance, notifications.
#
# Rien de secret n'est affiché : identifiants, jeton, numéros et codes PIN de
# test, code marchand, clé des notifications et liens de paiement sont masqués
# dans le journal dès leur lecture, et les fichiers temporaires sont effacés.
# Voir mobile/FIREBASE_SETUP.md, section « Passage à l'argent réel ».
on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement d'Orange : bac_a_sable (données de test) ou production (identifiants de production ; l'essai ne paie rien)."
        required: true
        default: bac_a_sable
        type: choice
        options:
          - bac_a_sable
          - production
      code_marchand:
        description: "Code marchand Orange (6 chiffres) ; vide : celui de Secret Manager s'il y est. Masqué dans le journal."
        required: false
        default: ""
        type: string
      preparer_notifications:
        description: "Préparer les notifications de l'environnement choisi : secrets manquants (code marchand, clé) dans Secret Manager et adresse de Sprint enregistrée chez Orange."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: essai-orange-money
  cancel-in-progress: true

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Noms des secrets de l'environnement choisi (SECRETS_ORANGE_MONEY,
      # functions/src/paiement_orange.ts ; un test vérifie qu'ils sont ici).
      - name: Environnement d'Orange Money
        env:
          ENVIRONNEMENT: ${{ inputs.environnement }}
        run: |
          case "$ENVIRONNEMENT" in
            bac_a_sable)
              {
                echo "ORANGE_ENVIRONNEMENT=bacASable"
                echo "SECRET_ID_CLIENT=ORANGE_MONEY_SANDBOX_CLIENT_ID"
                echo "SECRET_SECRET_CLIENT=ORANGE_MONEY_SANDBOX_CLIENT_SECRET"
                echo "SECRET_CLE_NOTIFICATION=ORANGE_MONEY_SANDBOX_CLE_NOTIFICATION"
              } >> "$GITHUB_ENV"
              echo "::notice title=Environnement::Bac à sable d'Orange : données de test, aucun argent réel."
              ;;
            production)
              {
                echo "ORANGE_ENVIRONNEMENT=production"
                echo "SECRET_ID_CLIENT=ORANGE_MONEY_CLIENT_ID"
                echo "SECRET_SECRET_CLIENT=ORANGE_MONEY_CLIENT_SECRET"
                echo "SECRET_CLE_NOTIFICATION=ORANGE_MONEY_CLE_NOTIFICATION"
              } >> "$GITHUB_ENV"
              echo "::notice title=Environnement::PRODUCTION d'Orange : identifiants réels ; l'essai ne paie rien (demandes jamais payées, qui expirent seules)."
              ;;
            *)
              echo "::error title=Environnement::Environnement inconnu : bac_a_sable ou production."
              exit 1
              ;;
          esac

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "::error title=Essai impossible::Secret FIREBASE_SERVICE_ACCOUNT absent."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/functions/package-lock.json
            mobile/firestore_rules_test/package-lock.json

      # L'émulateur Firestore est une application Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installation (serveur et émulateur)
        run: |
          npm ci --prefix functions
          npm ci --prefix firestore_rules_test

      - name: Tests automatiques du serveur (faux Orange, sans réseau)
        run: npm test --prefix functions

      - name: Tests sur l'émulateur Firestore (paiements, portefeuille, Orange Money)
        run: npm run test:emulateur --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Fichiers lus par les étapes suivantes, dans $RUNNER_TEMP/orange (effacé
      # à la fin, même en cas d'échec).
      - name: Identifiants d'Orange Money (environnement choisi) et code marchand
        run: |
          dossier="$RUNNER_TEMP/orange"
          mkdir -p "$dossier"
          erreurs=0
          for paire in "$SECRET_ID_CLIENT:ID_CLIENT" "$SECRET_SECRET_CLIENT:SECRET_CLIENT"; do
            nom="${paire%%:*}"
            fichier="$dossier/${paire##*:}"
            if ! gcloud secrets versions access latest --secret="$nom" --project=sprint-vtc \
                   --out-file="$fichier" > /dev/null 2> "$dossier/erreur.txt"; then
              raison=$(grep -o -m 1 -E 'NOT_FOUND|PERMISSION_DENIED|FAILED_PRECONDITION' "$dossier/erreur.txt" || true)
              echo "::error title=$nom::Secret illisible par la CI (${raison:-erreur inconnue}) : nom exact ? version activée ?"
              erreurs=$((erreurs + 1))
              continue
            fi
            # Masquage d'abord, contrôle ensuite ; la valeur n'est jamais écrite dans le journal.
            python3 - "$fichier" "$nom" <<'PY' || erreurs=$((erreurs + 1))
          import sys
          chemin, nom = sys.argv[1], sys.argv[2]
          octets = open(chemin, 'rb').read()
          texte = octets.decode('utf-8', errors='replace')
          for morceau in {texte, texte.strip(), *texte.splitlines()}:
              if morceau.strip():
                  print('::add-mask::' + morceau.strip())
          problemes = []
          if not octets.strip():
              problemes.append('vide')
          else:
              if octets != octets.strip():
                  problemes.append('espace ou retour à la ligne au début ou à la fin')
              coeur = octets.strip()
              if any(o < 33 or o > 126 for o in coeur):
                  problemes.append('espace, accent ou caractère invisible au milieu')
          if problemes:
              print(f'::error title={nom}::Présent mais à corriger : {", ".join(problemes)}.')
              sys.exit(1)
          print(f'::notice title={nom}::Présent, lisible par la CI, sans espace ni caractère invisible.')
          PY
          done
          # Code marchand : lu dans l'événement (jamais dans le texte du flux ni
          # dans ses variables affichées), sinon dans Secret Manager ; masqué avant tout usage.
          code=$(jq -r '.inputs.code_marchand // empty' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          origine="saisi au lancement"
          if [ -z "$code" ] && gcloud secrets versions access latest --secret=ORANGE_MONEY_CODE_MARCHAND \
                 --project=sprint-vtc --out-file="$dossier/code_secret" > /dev/null 2>&1; then
            code=$(tr -d '[:space:]' < "$dossier/code_secret")
            origine="lu dans Secret Manager"
          fi
          if [ -n "$code" ]; then echo "::add-mask::$code"; fi
          printf '%s' "$code" > "$dossier/CODE_MARCHAND"
          if [ -z "$code" ]; then
            echo "::warning title=Code marchand::Ni saisi au lancement, ni dans Secret Manager : demandes de paiement et parcours sautés."
          elif ! echo "$code" | grep -qE '^[0-9]{6}$'; then
            echo "::error title=Code marchand::Code marchand $origine : 6 chiffres attendus."
            erreurs=$((erreurs + 1))
          else
            echo "::notice title=Code marchand::Code marchand $origine (6 chiffres)."
          fi
          [ "$erreurs" -eq 0 ]

      # Facultatif : prépare la réception des notifications d'Orange dans
      # l'environnement choisi. Ne change rien à l'app publiée : le serveur ne
      # s'en sert qu'une fois cet environnement mis en service par une
      # publication (go du client).
      - name: Préparer les notifications (Secret Manager et adresse chez Orange)
        if: ${{ inputs.preparer_notifications }}
        run: |
          dossier="$RUNNER_TEMP/orange"
          code=$(cat "$dossier/CODE_MARCHAND")
          if ! echo "$code" | grep -qE '^[0-9]{6}$'; then
            echo "::error title=Préparation impossible::Code marchand (6 chiffres) nécessaire pour enregistrer les notifications."
            exit 1
          fi
          # Code marchand : créé s'il manque ; jamais remplacé en silence.
          if gcloud secrets describe ORANGE_MONEY_CODE_MARCHAND --project=sprint-vtc > /dev/null 2>&1; then
            gcloud secrets versions access latest --secret=ORANGE_MONEY_CODE_MARCHAND --project=sprint-vtc \
              --out-file="$dossier/code_actuel" > /dev/null
            if [ "$(tr -d '[:space:]' < "$dossier/code_actuel")" != "$code" ]; then
              echo "::error title=ORANGE_MONEY_CODE_MARCHAND::Déjà dans Secret Manager, avec une autre valeur que le code saisi : rien n'est remplacé."
              exit 1
            fi
            echo "::notice title=ORANGE_MONEY_CODE_MARCHAND::Déjà dans Secret Manager, identique au code saisi."
          else
            gcloud secrets create ORANGE_MONEY_CODE_MARCHAND --project=sprint-vtc --replication-policy=automatic \
              --data-file="$dossier/CODE_MARCHAND" > /dev/null
            echo "::notice title=ORANGE_MONEY_CODE_MARCHAND::Créé dans Secret Manager."
          fi
          # Clé des notifications de l'environnement : 64 caractères aléatoires,
          # créée une seule fois, jamais affichée, jamais partagée entre les deux.
          if gcloud secrets describe "$SECRET_CLE_NOTIFICATION" --project=sprint-vtc > /dev/null 2>&1; then
            echo "::notice title=$SECRET_CLE_NOTIFICATION::Déjà dans Secret Manager : réutilisée."
          else
            openssl rand -hex 32 | tr -d '\n' > "$dossier/cle_nouvelle"
            echo "::add-mask::$(cat "$dossier/cle_nouvelle")"
            gcloud secrets create "$SECRET_CLE_NOTIFICATION" --project=sprint-vtc --replication-policy=automatic \
              --data-file="$dossier/cle_nouvelle" > /dev/null
            echo "::notice title=$SECRET_CLE_NOTIFICATION::Créée dans Secret Manager (64 caractères aléatoires, jamais affichés)."
          fi
          gcloud secrets versions access latest --secret="$SECRET_CLE_NOTIFICATION" --project=sprint-vtc \
            --out-file="$dossier/CLE_NOTIFICATION" > /dev/null
          echo "::add-mask::$(cat "$dossier/CLE_NOTIFICATION")"

      - name: Appels réels à Orange Money (environnement choisi, rien n'est payé)
        run: |
          dossier="$RUNNER_TEMP/orange"
          cle=""
          url=""
          if [ -f "$dossier/CLE_NOTIFICATION" ]; then
            cle=$(cat "$dossier/CLE_NOTIFICATION")
            url="https://europe-west1-sprint-vtc.cloudfunctions.net/webhookOrangeMoney"
          fi
          ORANGE_CLIENT_ID="$(cat "$dossier/ID_CLIENT")" \
          ORANGE_CLIENT_SECRET="$(cat "$dossier/SECRET_CLIENT")" \
          ORANGE_CODE_MARCHAND="$(cat "$dossier/CODE_MARCHAND")" \
          ORANGE_CLE_NOTIFICATION="$cle" \
          ORANGE_URL_NOTIFICATION="$url" \
            node functions/lib/test/orange_money.essai_reel.js

      - name: Parcours complet de Sprint (émulateur Firestore + vrai Orange, rien n'est payé)
        run: |
          dossier="$RUNNER_TEMP/orange"
          if [ ! -s "$dossier/CODE_MARCHAND" ]; then
            echo "::warning title=Parcours complet::Sans code marchand : parcours sauté."
            exit 0
          fi
          cd functions
          ORANGE_CLIENT_ID="$(cat "$dossier/ID_CLIENT")" \
          ORANGE_CLIENT_SECRET="$(cat "$dossier/SECRET_CLIENT")" \
          ORANGE_CODE_MARCHAND="$(cat "$dossier/CODE_MARCHAND")" \
            ../firestore_rules_test/node_modules/.bin/firebase emulators:exec --only firestore --project demo-sprint \
              "node lib/test/orange_money.parcours_reel.js"

      - name: Effacer les fichiers temporaires
        if: always()
        run: rm -rf "$RUNNER_TEMP/orange"
