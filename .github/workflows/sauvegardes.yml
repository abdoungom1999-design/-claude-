name: Sauvegardes Firestore

# Les sauvegardes de la base sont prises par Google lui-même (planification
# gérée de Firestore : une par jour, gardée 14 jours, et une par semaine,
# gardée 14 semaines) : elles continuent même si GitHub s'arrête. Ce flux les
# met en place (rien n'est modifié si elles existent déjà), puis vérifie chaque
# jour qu'une sauvegarde récente existe vraiment. En cas de problème il
# échoue et, lancé par le planning, ouvre un ticket GitHub (un seul tant qu'il
# reste ouvert). Il ne déploie rien : le site, l'APK, les fonctions et les
# règles ne sont pas touchés. Détails : mobile/FIREBASE_SETUP.md, section 10.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Ajouter le diagnostic des droits Google (lecture seule : compte qui exécute les fonctions, droits manquants)"
        type: boolean
        default: false
      lancer_fonction:
        description: "Forcer une exécution de la fonction de contrôle verifierSauvegardes chez Google, puis dire ce qu'elle a donné (à faire après sa publication)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: sauvegardes
  cancel-in-progress: false

jobs:
  sauvegardes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret FIREBASE_SERVICE_ACCOUNT présent ?
        env:
          COMPTE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COMPTE_SERVICE" ]; then
            echo "::error title=Sauvegardes non contrôlées::Secret FIREBASE_SERVICE_ACCOUNT absent (voir mobile/FIREBASE_SETUP.md, étape 7)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Le jeton est masqué dans les journaux (le dépôt et ses journaux sont publics).
      - name: Jeton Google
        run: |
          jeton=$(gcloud auth print-access-token)
          echo "::add-mask::$jeton"
          echo "JETON_GOOGLE=$jeton" >> "$GITHUB_ENV"

      - name: Droits du compte de déploiement
        run: node securite/sauvegardes.mjs droits

      - name: Planifications (créées seulement si elles manquent)
        run: node securite/sauvegardes.mjs planifier

      - name: Une sauvegarde récente existe-t-elle ?
        run: node securite/sauvegardes.mjs verifier

      # Lancé à la main avec la case cochée : n'écrit rien chez Google, ne change pas le verdict du contrôle.
      - name: Diagnostic des droits (lecture seule)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic
        run: node securite/sauvegardes.mjs diagnostic

      # Lancé à la main avec la case cochée : la fonction fait son contrôle tout de suite (elle ne prévient les Admin
      # que s'il y a un problème) ; ne change pas le verdict du contrôle de ce flux.
      - name: Lancer la fonction de contrôle chez Google
        if: always() && github.event_name == 'workflow_dispatch' && inputs.lancer_fonction
        run: node securite/sauvegardes.mjs lancer-fonction

      - name: Ticket GitHub (contrôle planifié en échec)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          titre="Sauvegardes Firestore : à vérifier"
          ouvert=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ouvert" ]; then
            echo "Ticket déjà ouvert : #$ouvert"
            exit 0
          fi
          gh issue create --title "$titre" --body "Le contrôle quotidien des sauvegardes de la base Firestore a échoué.

          Détail (annotations en haut de la page) : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Marche à suivre : mobile/FIREBASE_SETUP.md, section 10. Ce ticket n'est créé qu'une fois tant qu'il reste ouvert : le fermer quand le problème est réglé.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
